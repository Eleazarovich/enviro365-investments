server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: enviro365
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/enviro365;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
app:
  seed-enabled: ${SEED_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4028,http://127.0.0.1:4028}

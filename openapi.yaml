openapi: 3.0.3
info:
  title: Enviro365 Investments API
  version: 0.1.0
  description: |
    Backend contract expected by the existing frontend HTTP adapter. The backend
    is not implemented yet; this specification describes the frontend types,
    mock behavior, HTTP fixtures, and agreed API contract.

    Set NEXT_PUBLIC_USE_MOCK_API=false to use HTTP. NEXT_PUBLIC_API_BASE_URL is
    the backend origin/base URL, without the /api suffix; it defaults to an
    empty string for same-origin requests. The frontend currently always uses
    investorId=1. The path parameter documents the intended investor-scoped API.

    None of these operations requires authentication in the current frontend
    contract. The adapter has no login flow, token, or Authorization header and
    uses fetch's default credential behavior. No authentication scheme is defined.

    JSON money values are numbers in South African rand (ZAR), with at most two
    decimal places. Withdrawal amounts are positive in JSON; the CSV uses negative
    deductions. Successful JSON responses are the objects/arrays below, with no
    data envelope or pagination wrapper. GET requests have no request body.

    For non-2xx responses, the adapter reads only the top-level JSON message.
    It derives its local error code from the HTTP status: 404 becomes NOT_FOUND,
    5xx becomes UNEXPECTED, and other failures become VALIDATION_ERROR (including
    422). A response without a usable JSON message produces the fallback text
    "Something went wrong. Please try again." No server-side code or status field
    is required in the error body.
servers:
  - url: /
    description: Same-origin default; replace with NEXT_PUBLIC_API_BASE_URL for a separate backend.
security: []
tags:
  - name: Portfolio
  - name: Withdrawals
x-frontend-sources:
  - frontend/src/lib/api/config.ts
  - frontend/src/lib/api/httpApi.ts
  - frontend/src/lib/types.ts
  - frontend/src/lib/api/mockApi.ts
  - frontend/src/lib/api/mockStore.ts
  - frontend/tests/e2e/portfolio.spec.ts
  - _docs/SPEC.md
paths:
  /api/investors/{investorId}/portfolio:
    parameters:
      - $ref: '#/components/parameters/InvestorId'
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      summary: Retrieve the investor and their investment portfolio
      description: |
        Returns all products used by both the portfolio and investment detail
        screens. The frontend selects individual products from this response;
        it does not call a separate investment-detail endpoint. After a successful
        withdrawal, it calls this endpoint again for updated balances and limits.
      security: []
      responses:
        '200':
          description: Investor details, total available balance, and investment products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
              example:
                investor:
                  id: 1
                  name: Eleazarovich
                  age: 68
                  investorSince: '2026-10-01'
                totalAvailable: 140000
                products:
                  - id: 1
                    name: Cash Investment
                    type: GENERAL
                    availableBalance: 80000
                    minimumWithdrawable: 100
                    maximumWithdrawable: 72000
                    pendingWithdrawals: 20000
                  - id: 2
                    name: Retirement Investment
                    type: RETIREMENT
                    availableBalance: 60000
                    minimumWithdrawable: 100
                    maximumWithdrawable: 54000
                    pendingWithdrawals: 0
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /api/investors/{investorId}/withdrawal-notices:
    parameters:
      - $ref: '#/components/parameters/InvestorId'
    get:
      tags: [Withdrawals]
      operationId: getWithdrawals
      summary: List withdrawal notices with optional investment and date filters
      description: |
        Returns a bare array, newest submittedAt first. Omitted filters impose no
        restriction; supplied filters are combined with AND. Date bounds include
        the entire start and end dates and compare the YYYY-MM-DD date portion
        of submittedAt, matching the mock adapter's UTC timestamps. If both dates
        are supplied, fromDate must not be after toDate; the UI blocks that range.
        Empty history or no matching records returns [], not 204 or 404.
        Filtering and ordering must match the CSV export.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIdFilter'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Matching withdrawal notices, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WithdrawalNotice'
              examples:
                history:
                  value:
                    - id: 1001
                      productId: 1
                      productName: Cash Investment
                      amount: 20000
                      status: SUBMITTED
                      submittedAt: '2026-10-21T09:12:00Z'
                empty:
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Withdrawals]
      operationId: createWithdrawal
      summary: Submit a withdrawal notice for an investment
      description: |
        The body contains only the selected productId and a numeric amount.
        The product must belong to the investor. Amounts must be positive, have
        at most two decimal places, meet the R100 minimum, and not exceed either
        the current available balance or maximumWithdrawable. RETIREMENT products
        additionally require an investor age strictly greater than 65; age 65
        is ineligible. Investor age and product type come from backend records.

        For every request, calculate percentageMaximum by rounding 90% of the
        remaining available balance down to cents. maximumWithdrawable is that
        amount if it is at least R100, otherwise zero. Pending withdrawals have
        already reduced the available balance and must not be subtracted again.
        There is no exception to withdraw the final balance below the minimum.

        Success creates a SUBMITTED notice and immediately reserves its amount,
        reducing the available balance exactly once. Persist the notice and
        balance effect atomically, including for concurrent requests. Invalid
        requests leave both unchanged. The response is only the created notice;
        the frontend separately reloads portfolio and history. Submission does
        not mean a bank payment has completed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWithdrawalRequest'
            example:
              productId: 1
              amount: 1500.75
      responses:
        '201':
          description: The created withdrawal notice, with a positive amount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalNotice'
              example:
                id: 1002
                productId: 1
                productName: Cash Investment
                amount: 1500.75
                status: SUBMITTED
                submittedAt: '2026-10-29T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Business rule rejection: retirement investor age is 65 or younger,
            amount exceeds the available balance, or amount exceeds the current
            maximum withdrawal (including a zero maximum). The mock distinguishes
            NOT_ELIGIBLE, INSUFFICIENT_BALANCE, and LIMIT_EXCEEDED locally; the
            HTTP adapter displays message and maps all 422 responses to its
            local VALIDATION_ERROR code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                retirementAge:
                  value:
                    message: Retirement withdrawals are only available to investors older than 65.
                insufficientBalance:
                  value:
                    message: Your available balance for this investment is R80,000.
                limitExceeded:
                  value:
                    message: You can withdraw up to R72,000 from this investment.
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /api/investors/{investorId}/withdrawal-notices/export:
    parameters:
      - $ref: '#/components/parameters/InvestorId'
    get:
      tags: [Withdrawals]
      operationId: exportWithdrawals
      summary: Download a CSV statement of matching withdrawals
      description: |
        Uses the same combined filters, inclusive date bounds, and newest-first
        ordering as getWithdrawals. The body is raw CSV text, not a JSON object
        containing filename and content; the HTTP adapter creates that local
        CsvExport object from the response headers and text.

        CSV columns are exactly Date,Investment,Amount. Date is the YYYY-MM-DD
        portion of submittedAt. Investment is productName, quoted and escaped
        when needed (the mock always quotes it and doubles embedded quotes).
        Amount is a negative numeric deduction with two decimal places, without
        currency symbols or thousands separators. Rows use CRLF line endings.
        Empty results return 200 with the header row only. Notice IDs, status,
        and pending totals are omitted. The download UI adds the UTF-8 BOM.

        Content-Disposition may supply a filename; otherwise the adapter uses
        withdrawal-statement-YYYY-MM-DD.csv with the current UTC date. For a
        cross-origin backend, allow the frontend origin and POST Content-Type
        header in CORS, and expose Content-Disposition so the adapter can read it.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIdFilter'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: UTF-8 CSV statement, including the header when there are no matches.
          headers:
            Content-Disposition:
              description: Optional attachment filename read by the HTTP adapter.
              schema:
                type: string
              example: 'attachment; filename="withdrawal-statement-2026-10-29.csv"'
          content:
            text/csv:
              schema:
                type: string
              example: "Date,Investment,Amount\r\n2026-10-21,\"Cash Investment\",-20000.00"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
components:
  parameters:
    InvestorId:
      name: investorId
      in: path
      required: true
      description: Investor identifier. The current frontend always sends 1.
      schema:
        type: integer
        example: 1
    ProductIdFilter:
      name: productId
      in: query
      required: false
      description: Restrict results to this investment product; omit for all investments.
      schema:
        type: integer
        example: 1
    FromDate:
      name: fromDate
      in: query
      required: false
      description: Inclusive lower bound on the submission date (YYYY-MM-DD); omit for no lower bound.
      schema:
        type: string
        format: date
        example: '2026-09-01'
    ToDate:
      name: toDate
      in: query
      required: false
      description: Inclusive upper bound on the submission date (YYYY-MM-DD); omit for no upper bound.
      schema:
        type: string
        format: date
        example: '2026-10-29'
  schemas:
    Money:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: Non-negative amount in ZAR, encoded as a JSON number with at most two decimal places.
      example: 1500.75
    Investor:
      type: object
      required: [id, name, age]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Eleazarovich
        age:
          type: integer
          description: Investor age in years; retirement withdrawals require age greater than 65.
          example: 68
        investorSince:
          type: string
          format: date
          description: Optional investment start date; omit when unavailable.
          example: '2026-10-01'
    InvestmentProduct:
      type: object
      required:
        - id
        - name
        - type
        - availableBalance
        - minimumWithdrawable
        - maximumWithdrawable
        - pendingWithdrawals
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Cash Investment
        type:
          type: string
          enum: [GENERAL, RETIREMENT]
          description: GENERAL is displayed as Standard investment by the frontend.
        availableBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Remaining balance after active pending withdrawals have been deducted once.
          example: 80000
        minimumWithdrawable:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Minimum amount per request; currently R100, even when the maximum is zero.
          example: 100
        maximumWithdrawable:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            90% of availableBalance rounded down to cents, or zero if that result
            is below minimumWithdrawable. Recalculated for each request. This
            numerical limit is separate from the investor's retirement age check.
          example: 72000
        pendingWithdrawals:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Active pending total already excluded from availableBalance; an internal API field.
          example: 20000
    Portfolio:
      type: object
      required: [investor, totalAvailable, products]
      properties:
        investor:
          $ref: '#/components/schemas/Investor'
        totalAvailable:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Sum of availableBalance across all returned products.
          example: 140000
        products:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentProduct'
    CreateWithdrawalRequest:
      type: object
      required: [productId, amount]
      properties:
        productId:
          type: integer
          description: Identifier of the selected product in this investor's portfolio.
          example: 1
        amount:
          type: number
          minimum: 100
          multipleOf: 0.01
          description: Positive JSON number in ZAR, at least R100 and within the current balance and maximum.
          example: 1500.75
    WithdrawalNotice:
      type: object
      required: [id, productId, productName, amount, status, submittedAt]
      properties:
        id:
          type: integer
          example: 1002
        productId:
          type: integer
          example: 1
        productName:
          type: string
          example: Cash Investment
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          description: Positive withdrawal amount in ZAR; only display and CSV apply a negative sign.
          example: 1500.75
        status:
          type: string
          enum: [SUBMITTED]
          description: Internal notice status; does not indicate payment completion or whether still pending.
        submittedAt:
          type: string
          format: date-time
          description: ISO 8601 submission timestamp; the mock emits UTC timestamps.
          example: '2026-10-29T12:00:00Z'
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable error text displayed directly by the frontend.
          example: Minimum withdrawal is R100.
      additionalProperties: true
      description: Only message is consumed by the frontend; additional error fields are ignored.
  responses:
    BadRequest:
      description: Invalid input, such as malformed JSON, missing fields, invalid amount precision, amount below R100, or invalid filters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Enter an amount with no more than two decimal places.
    NotFound:
      description: The investor or the investment selected for withdrawal does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: We couldn't find that investment.
    InternalServerError:
      description: Unexpected failure; the frontend displays message and offers an appropriate retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Please try again. Your request could not be completed.
    Error:
      description: Any other non-2xx response; the frontend handles all failures through the same message parser.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

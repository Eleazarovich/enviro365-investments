<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Enviro365 Investments application architecture</title>
  <desc id="description">Next.js screens call a shared HTTP adapter. It sends REST requests to Spring Boot controllers, which pass validated DTOs to services for financial rules and transactions. Spring Data JPA repositories persist investors, investment products, and withdrawal notices in H2.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#663344" stroke-width="1.5" />
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #26252B; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #663344; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #6A6364; }
      .panel { fill: #FFFFFF; stroke: #E6DFDC; stroke-width: 1.5; }
      .step { fill: #F8F5F0; stroke: #E6DFDC; }
      .flow { fill: none; stroke: #663344; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#F8F5F0" />

  <rect x="24" y="36" width="284" height="270" rx="14" class="panel" />
  <text x="48" y="66" class="label">FRONTEND</text>
  <text x="48" y="96" class="heading">Next.js App Router</text>
  <text x="48" y="122" class="body">React · TypeScript · Tailwind CSS</text>
  <rect x="48" y="146" width="236" height="62" rx="8" class="step" />
  <text x="166" y="171" text-anchor="middle" class="body">Portfolio · Withdrawals</text>
  <text x="166" y="191" text-anchor="middle" class="small">Forms, history, and CSV downloads</text>
  <path d="M 166 208 V 229" class="flow" />
  <rect x="48" y="234" width="236" height="48" rx="8" fill="#EADDE2" />
  <text x="166" y="254" text-anchor="middle" class="body">Shared HTTP adapter</text>
  <text x="166" y="272" text-anchor="middle" class="small">src/lib/api/</text>

  <path d="M 308 258 H 386" class="flow" />
  <text x="347" y="233" text-anchor="middle" class="small">REST</text>
  <text x="347" y="249" text-anchor="middle" class="small">JSON / CSV</text>

  <rect x="392" y="36" width="544" height="270" rx="14" class="panel" />
  <text x="416" y="66" class="label">BACKEND</text>
  <text x="416" y="96" class="heading">Spring Boot 4.1.2 · Java 21</text>
  <text x="416" y="122" class="body">REST API and authoritative financial rules</text>

  <rect x="416" y="162" width="148" height="120" rx="8" class="step" />
  <text x="490" y="190" text-anchor="middle" class="body" font-weight="700">Controllers</text>
  <text x="490" y="214" text-anchor="middle" class="small">Request / response DTOs</text>
  <text x="490" y="234" text-anchor="middle" class="small">Input validation</text>
  <text x="490" y="254" text-anchor="middle" class="small">Consistent HTTP errors</text>
  <path d="M 564 222 H 583" class="flow" />

  <rect x="588" y="162" width="148" height="120" rx="8" class="step" />
  <text x="662" y="190" text-anchor="middle" class="body" font-weight="700">Services</text>
  <text x="662" y="214" text-anchor="middle" class="small">Eligibility and limits</text>
  <text x="662" y="234" text-anchor="middle" class="small">Transactions</text>
  <text x="662" y="254" text-anchor="middle" class="small">Filters and CSV export</text>
  <path d="M 736 222 H 755" class="flow" />

  <rect x="760" y="162" width="152" height="120" rx="8" class="step" />
  <text x="836" y="190" text-anchor="middle" class="body" font-weight="700">Repositories</text>
  <text x="836" y="214" text-anchor="middle" class="small">Spring Data JPA</text>
  <text x="836" y="234" text-anchor="middle" class="small">Product row locking</text>
  <text x="836" y="254" text-anchor="middle" class="small">Decimal money storage</text>

  <path d="M 936 222 H 997" class="flow" />
  <text x="969" y="207" text-anchor="middle" class="small">SQL</text>
  <rect x="1004" y="146" width="172" height="136" rx="14" class="panel" />
  <text x="1090" y="179" text-anchor="middle" class="heading">H2</text>
  <text x="1090" y="205" text-anchor="middle" class="small">Investors and products</text>
  <text x="1090" y="225" text-anchor="middle" class="small">Withdrawal notices</text>
  <text x="1090" y="251" text-anchor="middle" class="small">Local file persistence</text>

  <text x="600" y="337" text-anchor="middle" class="small">Available balance = recorded balance − active submitted reservations</text>
</svg>
